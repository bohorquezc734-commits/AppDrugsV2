name: CI — Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AppDrugsV2.sln

      - name: Build (Release)
        run: dotnet build AppDrugsV2.sln --no-restore -c Release

      - name: Run Unit Tests
        run: dotnet test AppDrugsV2.UnitTests/AppDrugsV2.UnitTests.csproj --no-build -c Release --verbosity normal

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t appdrugs-api:ci .
